<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscrição - Clube de Corrida</title>
  <link rel="stylesheet" href="FormsValidation.css">
    <script src="formsValidation.js" defer></script>
</head>
<body>

  <form id="raceForm" action="sucesso.html" method="GET">
    <h2>Inscrição - Clube de Corrida</h2>

    <label for="fullName">Nome Completo:</label>
    <input type="text" id="fullName" name="fullName" minlength="3" required>

    <label for="userEmail">E-mail para Contato:</label>
    <input type="email" id="userEmail" name="userEmail" required>

    <label for="confirmEmail">Confirme seu E-mail:</label>
    <input type="email" id="confirmEmail" name="confirmEmail" required>

    <label for="runnerAge">Idade (Permitido de 18 a 100 anos):</label>
    <input type="number" id="runnerAge" name="runnerAge" min="18" max="100" required>

    <button type="submit">Garantir Vaga</button>
  </form>
 
</body>
</html>
